# Pull requests validate the supported V3 frontend and existing FastAPI.
# Legacy Angular / Firebase pipelines are intentionally excluded.
substitutions:
  _PUBLIC_SITE_INDEXING: "false"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: preview-config-preflight
    name: python:3.12-slim
    entrypoint: python
    env: ["DEPLOY_PUBLIC_SITE_INDEXING=$_PUBLIC_SITE_INDEXING"]
    args: ["scripts/gcp/deployment_contract.py", "--scope", "preview"]

  - id: backend-checks
    name: python:3.12-slim
    entrypoint: sh
    waitFor: ["preview-config-preflight"]
    args:
      - -c
      - >-
        cd backend &&
        python -m pip install --requirement requirements-dev.lock &&
        python -m pip install --no-deps --no-build-isolation --editable . &&
        python -m ruff check . &&
        python -m ruff format --check . &&
        python -m pytest

  - id: v3-static-checks
    name: node:22.22.3-bookworm-slim
    entrypoint: sh
    waitFor: ["preview-config-preflight"]
    args:
      - -c
      - >-
        node --test landing/build.test.mjs landing/form.test.mjs
        landing/motion.test.mjs landing/deployment.test.mjs
        scripts/protolume.test.mjs scripts/v3-cloudrun-preview.test.mjs
        scripts/v3-production.test.mjs &&
        node landing/build.mjs --preview &&
        node landing/verify-dist.mjs --preview

  - id: production-helper-tests
    name: python:3.12-slim
    entrypoint: python
    waitFor: ["preview-config-preflight"]
    args:
      - -m
      - unittest
      - discover
      - -s
      - scripts/gcp/tests
      - -p
      - test_smoke_v3_production.py

  - id: preview-traffic-guard-tests
    name: python:3.12-slim
    entrypoint: python
    waitFor: ["preview-config-preflight"]
    args:
      - -m
      - unittest
      - discover
      - -s
      - scripts/gcp/tests
      - -p
      - test_v3_cloudrun_preview_guard.py
