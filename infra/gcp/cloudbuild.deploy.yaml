# Production (master deploy-prod): Protolume v3 static Cloud Run + existing FastAPI contact.
# Do NOT deploy Angular or alter the backend/SMTP when releasing site-only changes.
# Preview v3-review stays tagged on its own 0%-traffic revision.
substitutions:
  _PROJECT_ID: "ai-software-studio-501918"
  _REGION: "europe-central2"
  _ARTIFACT_REPO: "aisoftware-studio"
  _BACKEND_SERVICE: "aisoftware-studio-api"
  _FRONTEND_SERVICE: "aisoftware-studio-web"
  _BACKEND_IMAGE_NAME: "aisoftware-studio-api"
  _FRONTEND_IMAGE_NAME: "aisoftware-studio-web"
  _BACKEND_URL: "https://aisoftware-studio-api-175725977490.europe-central2.run.app"
  _PUBLIC_SITE_URL: "https://protolume.pl"
  _PUBLIC_SITE_INDEXING: "true"
  _PUBLIC_SALES_EMAIL: "kontakt@protolume.pl"
  _PUBLIC_PRIVACY_EMAIL: "kontakt@protolume.pl"
  _PUBLIC_LEGAL_CONFIG_SECRET: "aisoftware-studio-public-legal-config"
  _SMTP_PASSWORD_SECRET: "aisoftware-studio-smtp-password"
  _CONTACT_RATE_LIMIT_PER_MINUTE: "30"
  _CONTACT_RECIPIENT_EMAIL: "<REQUIRED_EMAIL>"
  _CONTACT_FROM_EMAIL: "<REQUIRED_EMAIL>"
  _SMTP_HOST: "<REQUIRED_SMTP_HOST>"
  _SMTP_PORT: "<REQUIRED_PORT>"
  _SMTP_USERNAME: "<REQUIRED_SMTP_USERNAME>"
  _SMTP_USE_TLS: "<REQUIRED_BOOLEAN>"
  _CONTACT_DELIVERY_MODE: "email"
  _APP_ENV: "production"
  _MIN_INSTANCES: "0"

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: v3-production-preflight
    name: node:22.22.3-bookworm-slim
    entrypoint: node
    env:
      - "DEPLOY_PROJECT_ID=$_PROJECT_ID"
      - "DEPLOY_REGION=$_REGION"
      - "DEPLOY_FRONTEND_SERVICE=$_FRONTEND_SERVICE"
      - "DEPLOY_SITE_URL=$_PUBLIC_SITE_URL"
      - "DEPLOY_INDEXING=$_PUBLIC_SITE_INDEXING"
      - "DEPLOY_FORM_ENDPOINT=/api/contact/brief"
      - "DEPLOY_BUILD_SHA=$SHORT_SHA"
    args: ["scripts/gcp/v3_production_guard.mjs"]

  - id: approved-legal-config
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: sh
    waitFor: ["v3-production-preflight"]
    args:
      - -c
      - |
        set -eu
        # Approved legal configuration is required for production contact.
        # Never echo or copy its source into the runtime container.
        gcloud secrets versions access latest \
          --secret=$_PUBLIC_LEGAL_CONFIG_SECRET \
          --project=$_PROJECT_ID > landing/.public-legal-config.json

  - id: v3-production-checks
    name: node:22.22.3-bookworm-slim
    entrypoint: sh
    waitFor: ["approved-legal-config"]
    args:
      - -c
      - |
        set -eu
        node --test landing/build.test.mjs landing/form.test.mjs \
          landing/motion.test.mjs landing/deployment.test.mjs \
          scripts/protolume.test.mjs scripts/v3-cloudrun-preview.test.mjs \
          scripts/v3-production.test.mjs
        FORM_ENDPOINT=/api/contact/brief \
          PUBLIC_LEGAL_CONFIG_PATH=landing/.public-legal-config.json \
          PUBLIC_BUILD_SHA=$SHORT_SHA \
          node landing/build.mjs --production
        node landing/verify-dist.mjs --production

  - id: v3-promotion-safety-tests
    name: python:3.12-slim
    entrypoint: python
    waitFor: ["v3-production-checks"]
    args:
      - -m
      - unittest
      - discover
      - -s
      - scripts/gcp/tests
      - -p
      - test_promote_v3_cloud_run.py

  - id: v3-production-image-build
    name: gcr.io/cloud-builders/docker
    waitFor: ["v3-production-checks", "v3-promotion-safety-tests"]
    args:
      - build
      - -f
      - landing/Dockerfile.cloudrun
      - --build-arg
      - NGINX_CONFIG=landing/nginx.production.conf
      - -t
      - "$_REGION-docker.pkg.dev/$_PROJECT_ID/$_ARTIFACT_REPO/$_FRONTEND_IMAGE_NAME:$SHORT_SHA"
      - .

  - id: v3-production-image-smoke
    name: gcr.io/cloud-builders/docker
    entrypoint: sh
    waitFor: ["v3-production-image-build"]
    args:
      - -c
      - >-
        sh scripts/gcp/smoke-v3-production-image.sh
        "$_REGION-docker.pkg.dev/$_PROJECT_ID/$_ARTIFACT_REPO/$_FRONTEND_IMAGE_NAME:$SHORT_SHA"
        "/api/contact/brief"

  - id: v3-production-image-push
    name: gcr.io/cloud-builders/docker
    waitFor: ["v3-production-image-smoke"]
    args:
      - push
      - "$_REGION-docker.pkg.dev/$_PROJECT_ID/$_ARTIFACT_REPO/$_FRONTEND_IMAGE_NAME:$SHORT_SHA"

  - id: v3-production-deploy-zero-traffic
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    waitFor: ["v3-production-image-push"]
    args:
      - run
      - deploy
      - "$_FRONTEND_SERVICE"
      - "--project=$_PROJECT_ID"
      - "--region=$_REGION"
      - --platform=managed
      - "--image=$_REGION-docker.pkg.dev/$_PROJECT_ID/$_ARTIFACT_REPO/$_FRONTEND_IMAGE_NAME:$SHORT_SHA"
      - --no-traffic
      - --quiet

  - id: v3-production-promote-traffic
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: /usr/lib/google-cloud-sdk/platform/bundledpythonunix/bin/python3
    waitFor: ["v3-production-deploy-zero-traffic"]
    args:
      - scripts/gcp/promote_v3_cloud_run.py
      - "--project=$_PROJECT_ID"
      - "--region=$_REGION"
      - "--service=$_FRONTEND_SERVICE"
      - "--image=$_REGION-docker.pkg.dev/$_PROJECT_ID/$_ARTIFACT_REPO/$_FRONTEND_IMAGE_NAME:$SHORT_SHA"

  - id: v3-production-live-smoke
    name: python:3.12-slim
    entrypoint: python
    waitFor: ["v3-production-promote-traffic"]
    args:
      - scripts/gcp/smoke_v3_production.py
      - "--site-url=$_PUBLIC_SITE_URL"
      - "--api-url=$_BACKEND_URL"
      - "--expected-build-sha=$SHORT_SHA"
      - --attempts=12
      - --retry-delay-seconds=5
