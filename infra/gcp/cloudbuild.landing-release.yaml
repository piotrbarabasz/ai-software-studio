# Manual live release only. Never attach a GitHub trigger to this file.
# Cloud Build substitutions must explicitly include release approval and Formspree endpoint.
substitutions:
  _PROJECT_ID: "ai-software-studio-501918"
  _FORM_ENDPOINT: "NOT_CONFIGURED"
  _RELEASE_APPROVAL: "NOT_APPROVED"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: block-unapproved-live-release
    name: node:22.22.3-bookworm-slim
    entrypoint: node
    env:
      - "DEPLOY_PROJECT_ID=$_PROJECT_ID"
      - "FORM_ENDPOINT=$_FORM_ENDPOINT"
      - "RELEASE_APPROVAL=$_RELEASE_APPROVAL"
    args: ["scripts/gcp/landing_release_preflight.mjs"]

  - id: validated-legal-config
    name: node:22.22.3-bookworm-slim
    entrypoint: node
    waitFor: ["block-unapproved-live-release"]
    secretEnv: ["PUBLIC_LEGAL_CONFIG_JSON"]
    args: ["frontend/scripts/write-build-legal-config.cjs"]

  - id: verify-and-build-site
    name: node:22.22.3-bookworm-slim
    entrypoint: sh
    waitFor: ["validated-legal-config"]
    env:
      - "FORM_ENDPOINT=$_FORM_ENDPOINT"
      - "PUBLIC_LEGAL_CONFIG_PATH=frontend/.public-legal-config.json"
    args:
      - -c
      - >-
        node --test landing/build.test.mjs landing/deployment.test.mjs &&
        node landing/build.mjs --production &&
        node landing/verify-dist.mjs --production

  - id: publish-firebase-live
    name: us-docker.pkg.dev/firebase-cli/us/firebase:15.36.0
    waitFor: ["verify-and-build-site"]
    args:
      - deploy
      - "--only=hosting"
      - "--project=$_PROJECT_ID"
      - "--non-interactive"

availableSecrets:
  secretManager:
    - versionName: projects/$_PROJECT_ID/secrets/aisoftware-studio-public-legal-config/versions/latest
      env: PUBLIC_LEGAL_CONFIG_JSON
