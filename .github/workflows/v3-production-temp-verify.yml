name: V3 production release one-off verification
on:
  push:
    branches:
      - feat/protolume-v3-production-cutover
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tools
        run: python -m pip install ruff==0.15.22 PyYAML==6.0.3
      - name: Python lint and production smoke tests
        run: |
          ruff check scripts/gcp/smoke_v3_production.py scripts/gcp/tests/test_smoke_v3_production.py
          ruff format --diff scripts/gcp/smoke_v3_production.py scripts/gcp/tests/test_smoke_v3_production.py || true
          ruff format --check scripts/gcp/smoke_v3_production.py scripts/gcp/tests/test_smoke_v3_production.py
          python -m unittest discover -s scripts/gcp/tests -p 'test_smoke_v3_production.py'
          python -m unittest discover -s scripts/gcp/tests -p 'test_v3_cloudrun_preview_guard.py'
          python - <<'PY'
          import yaml
          for path in ['infra/gcp/cloudbuild.deploy.yaml', 'infra/gcp/cloudbuild.pr-checks.yaml']:
              d=yaml.safe_load(open(path))
              ids=[s['id'] for s in d['steps']]
              assert len(ids)==len(set(ids)), path
              for i,s in enumerate(d['steps']):
                  assert all(x in ids[:i] for x in s.get('waitFor',[]) if x!='-'), (path,s['id'])
              print(path, len(ids), 'steps validated')
          PY
      - name: Node tests (V3 frontend and release contracts)
        run: |
          node --test landing/build.test.mjs landing/form.test.mjs landing/motion.test.mjs landing/deployment.test.mjs scripts/protolume.test.mjs scripts/v3-cloudrun-preview.test.mjs scripts/v3-production.test.mjs
      - name: Build indexable V3 artifact with synthetic legal fixture
        run: |
          mkdir -p frontend
          cat > frontend/.public-legal-config.json <<'JSON'
          {
            "administrator":{"name":"Firma Ćwiczeniowa Jan Kowalski","correspondenceAddress":"Ulica Długa 3, 00-001 Warszawa"},
            "processing":{
              "purposes":["Odpowiedź na zapytanie"],
              "legalBases":["Działania na żądanie osoby kontaktującej się"],
              "retention":["Do zakończenia korespondencji"],
              "recipients":["Osoba prowadząca obsługę kontaktu"],
              "infrastructureProviders":["Dostawca hostingu"],
              "emailProviders":["Dostawca serwera pocztowego"],
              "dataSubjectRights":["Prawo dostępu do danych"]
            },
            "updatedAt":"2026-11-21"
          }
          JSON
          FORM_ENDPOINT=/api/contact/brief PUBLIC_LEGAL_CONFIG_PATH=frontend/.public-legal-config.json PUBLIC_BUILD_SHA=9f1a7bb node landing/build.mjs --production
          node landing/verify-dist.mjs --production
          rm -f frontend/.public-legal-config.json
      - name: Build production Nginx container
        run: docker build -f landing/Dockerfile.cloudrun --build-arg NGINX_CONFIG=landing/nginx.production.conf -t protolume-v3-ci:test .
      - name: Verify production container
        run: sh scripts/gcp/smoke-v3-production-image.sh protolume-v3-ci:test /api/contact/brief
