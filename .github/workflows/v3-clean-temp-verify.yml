name: V3 clean repo one-off validation
on:
  push:
    branches: [chore/protolume-v3-prune-legacy-angular]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test requirements and PyYAML
        run: |
          python -m pip install -r backend/requirements-dev.lock
          python -m pip install -e backend --no-deps --no-build-isolation
      - name: Backend Ruff, pytest and Cloud Build YAML
        run: |
          cd backend
          ruff check .
          ruff format --check .
          python -m pytest -q
          cd ..
          python -m unittest discover -s infra/gcp/tests -p 'test_cloudbuild_yaml.py'
          python -m unittest discover -s infra/gcp/tests -p 'test_deployment*.py'
      - name: V3 Node frontend/release tests
        run: |
          node --test landing/build.test.mjs landing/form.test.mjs landing/motion.test.mjs landing/deployment.test.mjs scripts/protolume.test.mjs scripts/v3-cloudrun-preview.test.mjs scripts/v3-production.test.mjs
          python -m unittest discover -s scripts/gcp/tests -p 'test_smoke_v3_production.py'
          python -m unittest discover -s scripts/gcp/tests -p 'test_v3_cloudrun_preview_guard.py'
      - name: Build production from standalone landing with synthetic legal
        run: |
          mkdir -p landing
          cat > landing/.public-legal-config.json <<'JSON'
          {
            "administrator":{"name":"Firma Ćwiczeniowa Jan Kowalski","correspondenceAddress":"Ulica Długa 3, 00-001 Warszawa"},
            "processing":{
              "purposes":["Odpowiedź na zapytanie"],
              "legalBases":["Działania na żądanie osoby kontaktującej się"],
              "retention":["Do zakończenia korespondencji"],
              "recipients":["Osoba prowadząca obsługę kontaktu"],
              "infrastructureProviders":["Dostawca hostingu"],
              "emailProviders":["Dostawca serwera pocztowego"],
              "dataSubjectRights":["Prawo dostępu do danych"]
            },
            "updatedAt":"2026-11-21"
          }
          JSON
          FORM_ENDPOINT=/api/contact/brief PUBLIC_LEGAL_CONFIG_PATH=landing/.public-legal-config.json PUBLIC_BUILD_SHA=9f1a7bb node landing/build.mjs --production
          node landing/verify-dist.mjs --production
          rm landing/.public-legal-config.json
      - name: Build and smoke standalone V3 container
        run: |
          docker build -f landing/Dockerfile.cloudrun --build-arg NGINX_CONFIG=landing/nginx.production.conf -t protolume-v3-clean:test .
          sh scripts/gcp/smoke-v3-production-image.sh protolume-v3-clean:test /api/contact/brief
      - name: Verify backend Docker build does not depend on Angular
        run: docker build -f backend/Dockerfile -t protolume-api-clean:test .
