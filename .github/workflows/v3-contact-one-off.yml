name: V3 contact one-off safe network diagnosis
on:
  push:
    branches:
      - diagnostic/v3-contact-network-20261121
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check preview routing and API health without sending messages
        shell: bash
        run: |
          set -eu
          PREVIEW="https://v3-review---aisoftware-studio-web-k6wldgptjq-lm.a.run.app"
          API="https://aisoftware-studio-api-175725977490.europe-central2.run.app"
          probe() {
            label="$1"; method="$2"; url="$3"; output="$4"
            code="$(curl --silent --show-error --max-time 20 --request "$method" --output "$output" --write-out '%{http_code}' "$url" || true)"
            printf '%s HTTP %s\n' "$label" "$code"
          }
          probe "Preview homepage" GET "$PREVIEW/" /tmp/preview.html
          if grep -q 'id="contact-form"' /tmp/preview.html; then echo "Preview page: V3 minimal contact detected"; else echo "Preview page: V3 minimal contact NOT detected"; fi
          if grep -q 'data-endpoint="/api/contact/brief"' /tmp/preview.html; then echo "Preview contact configuration: API enabled"; else echo "Preview contact configuration: API not enabled"; fi
          if grep -q 'protolume-build-sha' /tmp/preview.html; then echo "Preview appears to be legacy Angular"; fi
          probe "Preview GET /api/contact/brief" GET "$PREVIEW/api/contact/brief" /tmp/preview-get.txt
          probe "Direct backend GET /api/contact/brief" GET "$API/api/contact/brief" /tmp/backend-get.txt
          probe "Direct backend GET /health" GET "$API/health" /tmp/backend-health.txt
          echo "SAFE honeypot probe: website is non-empty, so FastAPI returns 202 without SMTP and without calling rate limiter."
          payload='{"name":"Diagnostic Probe","email":"probe@example.com","website":"https://diagnostic-honeypot.invalid","message":"Safe connectivity check"}'
          for origin in "$PREVIEW" "$API"; do
            code="$(curl --silent --show-error --max-time 20 -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' --data "$payload" --output /tmp/contact-post.txt --write-out '%{http_code}' "$origin/api/contact/brief" || true)"
            printf 'Honeypot POST via %s -> HTTP %s\n' "$([ "$origin" = "$PREVIEW" ] && echo 'preview proxy' || echo 'direct backend')" "$code"
            if [ "$code" != 202 ]; then head -c 300 /tmp/contact-post.txt | tr '\n' ' '; printf '\n'; fi
          done
          echo "Browser-like POST with Origin header (honeypot, no SMTP):"
          code="$(curl --silent --show-error --max-time 20 -X POST -H 'Origin: https://v3-review---aisoftware-studio-web-k6wldgptjq-lm.a.run.app' -H 'Content-Type: application/json' -H 'Accept: application/json' --data "$payload" --output /tmp/contact-origin.txt --write-out '%{http_code}' "$PREVIEW/api/contact/brief" || true)"
          printf 'Same-origin browser-like POST via preview proxy -> HTTP %s\n' "$code"
