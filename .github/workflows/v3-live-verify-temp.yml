name: Read-only Protolume V3 cutover verification
on:
  push:
    branches: [diagnostic/protolume-v3-live-cutover]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Watch public site and preview without changing production
        shell: bash
        run: |
          set -eu
          target="e9e9c48"
          for n in $(seq 1 12); do
            echo "Probe $n / 12"
            status=$(curl --silent --show-error --max-time 20 -o /tmp/protolume.html -w '%{http_code}' https://protolume.pl/ || true)
            headers=$(curl --silent --show-error --max-time 20 -I https://protolume.pl/ || true)
            printf 'public home HTTP=%s\n' "$status"
            sha=$(grep -o 'name="protolume-build-sha" content="[^"]*"' /tmp/protolume.html | head -1 || true)
            printf 'public build marker: %s\n' "$sha"
            if printf '%s' "$sha" | grep -Fq "$target"; then
              echo "PASS: V3 production build is live"
              if printf '%s' "$headers" | grep -qi 'x-robots-tag: noindex'; then
                echo 'FAIL: production still carries noindex header' >&2; exit 1
              fi
              grep -q 'data-endpoint="/api/contact/brief"' /tmp/protolume.html
              grep -q 'name="robots" content="index, follow"' /tmp/protolume.html
              curl --fail --silent --show-error --max-time 15 https://protolume.pl/robots.txt | grep -q 'Allow: /'
              curl --fail --silent --show-error --max-time 15 https://protolume.pl/polityka-prywatnosci/ | grep -q 'Administrator danych'
              preview=$(curl --silent --show-error --max-time 20 https://v3-review---aisoftware-studio-web-k6wldgptjq-lm.a.run.app/ || true)
              printf '%s' "$preview" | grep -q 'name="robots" content="noindex, nofollow"'
              echo "PASS: production indexable; preview noindex; API proxy still configured"
              exit 0
            fi
            [ "$n" = 12 ] && break
            sleep 15
          done
          echo 'INCOMPLETE: live site has not yet updated to target commit' >&2
          exit 1
