name: Verify lean Protolume V3 before master cleanup
on:
  push:
    branches:
      - chore/protolume-v3-lean-main-20261121
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        run: |
          python -m pip install -r backend/requirements-dev.lock
          python -m pip install -e backend --no-deps --no-build-isolation
      - name: Backend complete Ruff and pytest
        run: |
          cd backend
          ruff check .
          ruff format --check .
          python -m pytest -q
      - name: Cloud Build and production/preview promotion tests
        run: |
          python -m unittest discover -s infra/gcp/tests -p 'test_cloudbuild_yaml.py'
          python -m unittest discover -s infra/gcp/tests -p 'test_deployment*.py'
          python -m unittest discover -s scripts/gcp/tests -p 'test_promote_v3_cloud_run.py'
          python -m unittest discover -s scripts/gcp/tests -p 'test_smoke_v3_production.py'
          python -m unittest discover -s scripts/gcp/tests -p 'test_v3_cloudrun_preview_guard.py'
      - name: All V3 static and CI contract tests
        run: |
          node --test landing/build.test.mjs landing/form.test.mjs landing/motion.test.mjs landing/deployment.test.mjs scripts/protolume.test.mjs scripts/v3-cloudrun-preview.test.mjs scripts/v3-production.test.mjs
      - name: Build production V3 with synthetic legal test fixture
        run: |
          cat > landing/.public-legal-config.json <<'JSON'
          {
            "administrator":{"name":"Firma Ćwiczeniowa Jan Kowalski","correspondenceAddress":"Ulica Długa 3, 00-001 Warszawa"},
            "processing":{
              "purposes":["Odpowiedź na zapytanie"],
              "legalBases":["Działania na żądanie osoby kontaktującej się"],
              "retention":["Do zakończenia korespondencji"],
              "recipients":["Osoba prowadząca obsługę kontaktu"],
              "infrastructureProviders":["Dostawca hostingu"],
              "emailProviders":["Dostawca serwera pocztowego"],
              "dataSubjectRights":["Prawo dostępu do danych"]
            },
            "updatedAt":"2026-11-21"
          }
          JSON
          FORM_ENDPOINT=/api/contact/brief PUBLIC_LEGAL_CONFIG_PATH=landing/.public-legal-config.json PUBLIC_BUILD_SHA=814c6a5 node landing/build.mjs --production
          node landing/verify-dist.mjs --production
          rm landing/.public-legal-config.json
      - name: Production V3 Nginx Docker build and HTTP smoke
        run: |
          docker build -f landing/Dockerfile.cloudrun --build-arg NGINX_CONFIG=landing/nginx.production.conf -t protolume-v3-lean:test .
          sh scripts/gcp/smoke-v3-production-image.sh protolume-v3-lean:test /api/contact/brief
      - name: Backend Docker image independent from Angular
        run: docker build -f backend/Dockerfile -t protolume-api-lean:test .
