name: Protolume V3 live read-only spot check
on:
  push:
    branches: [diagnostic/protolume-v3-live-cutover]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read current public SHA and SEO
        shell: bash
        run: |
          set -eu
          curl -fsSL --max-time 25 https://protolume.pl/ -o /tmp/p.html
          echo "Public marker:"
          (grep -o 'name="protolume-build-sha" content="[^"]*"' /tmp/p.html | head -1) || true
          echo "V3 layout present?"
          if grep -q 'data-endpoint="/api/contact/brief"' /tmp/p.html; then echo YES; else echo NO; fi
          echo "Public SEO meta:"
          (grep -o 'name="robots" content="[^"]*"' /tmp/p.html | head -1) || true
          echo "Preview meta:"
          curl -fsSL --max-time 25 https://v3-review---aisoftware-studio-web-k6wldgptjq-lm.a.run.app/ | grep -o 'name="robots" content="[^"]*"' | head -1 || true
