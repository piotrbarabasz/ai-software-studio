name: Ruff one-off verification (temporary)
on:
  push:
    branches:
      - fix/protolume-v3-ruff-format-verified
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact CI Ruff
        run: python -m pip install ruff==0.15.22
      - name: Full backend Ruff check and formatter check
        run: |
          cd backend
          ruff --version
          ruff check .
          ruff format --check .
      - name: Install locked backend test dependencies
        run: |
          cd backend
          python -m pip install -r requirements-dev.lock
          python -m pip install -e .
      - name: Run backend tests
        run: cd backend && python -m pytest -q
      - name: Run static V3 tests
        run: node --test landing/build.test.mjs landing/form.test.mjs landing/motion.test.mjs landing/deployment.test.mjs scripts/protolume.test.mjs scripts/v3-cloudrun-preview.test.mjs
