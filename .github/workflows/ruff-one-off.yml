name: Ruff one-off verification (temporary)
on:
  push:
    branches:
      - fix/protolume-v3-ruff-format-verified
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact CI Ruff
        run: python -m pip install ruff==0.15.22
      - name: Show exact expected formatter diff
        run: |
          cd backend
          ruff --version
          ruff format --diff tests/contract/test_brief_contact_contract.py
          ruff format --check tests/contract/test_brief_contact_contract.py
