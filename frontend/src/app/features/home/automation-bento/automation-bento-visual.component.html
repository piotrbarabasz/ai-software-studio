<div class="problem-flow" [attr.data-bento-visual-kind]="visualKind" aria-hidden="true">
  @switch (visualKind) {
    @case ('process-panel') {
      <div class="linear-flow">
        <span class="problem-node">Email</span><i>↓</i>
        <span class="problem-node is-ai">AI extraction</span><i>↓</i>
        <span class="problem-node is-human">Human validation</span><i>↓</i>
        <span class="problem-node is-result">CRM</span>
      </div>
    }

    @case ('knowledge-assistant') {
      <div class="linear-flow">
        <span class="problem-node">Question</span><i>↓</i>
        <span class="problem-node is-ai">Knowledge</span><i>↓</i>
        <span class="problem-node">Sources</span><i>↓</i>
        <span class="problem-node is-result">Answer</span>
      </div>
    }

    @case ('channel-integrations') {
      <div class="branch-flow">
        <div class="channel-stack">
          <span class="problem-node">WhatsApp</span>
          <span class="problem-node">Email</span>
          <span class="problem-node">Form</span>
        </div>
        <span class="branch-connector">→</span>
        <span class="problem-node is-ai">Workflow</span>
        <span class="branch-connector">→</span>
        <span class="problem-node is-result">Owner</span>
      </div>
    }
  }
</div>
