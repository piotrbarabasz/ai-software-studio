<div appReveal class="problem-grid motion-stagger">
  @for (item of items; track item.id) {
    <article
      class="problem-card"
      [attr.data-visual-kind]="item.visualKind"
      [attr.aria-labelledby]="'problem-' + item.id + '-title'"
    >
      <header class="problem-card-header">
        <span class="problem-number" aria-hidden="true">{{ item.number }}</span>
        <p>Problem</p>
      </header>
      <h3 [id]="'problem-' + item.id + '-title'">{{ item.title }}</h3>
      <p class="problem-copy">{{ item.problem }}</p>
      <div class="problem-visual-block">
        <span class="problem-solution-label">Przepływ rozwiązania</span>
        <app-automation-bento-visual [visualKind]="item.visualKind" />
      </div>
    </article>
  }
</div>
