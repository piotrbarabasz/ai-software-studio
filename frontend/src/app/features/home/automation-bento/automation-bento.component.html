<div appReveal class="automation-bento motion-stagger">
  @for (item of items; track item.id) {
    <article
      class="automation-bento-card"
      [class.is-dark]="item.visualKind === 'agent-system'"
      [attr.data-visual-kind]="item.visualKind"
      [attr.aria-labelledby]="'bento-' + item.id + '-title'"
    >
      <div class="bento-card-copy">
        <p class="bento-category">{{ categoryByVisualKind[item.visualKind] }}</p>
        <h3 [id]="'bento-' + item.id + '-title'">{{ item.title }}</h3>
        <p class="bento-problem">{{ item.problem }}</p>
      </div>

      <app-automation-bento-visual [visualKind]="item.visualKind" />

      <div class="bento-card-footer">
        <p class="bento-outcome">
          {{ item.outcome }}
        </p>
        @if (item.cta) {
          <a
            class="secondary-action"
            [routerLink]="item.cta.path"
            [queryParams]="item.cta.queryParams"
            [fragment]="item.cta.fragment"
          >
            {{ item.cta.label }}
          </a>
        }
      </div>
    </article>
  }
</div>
