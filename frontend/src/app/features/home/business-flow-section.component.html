<section class="business-flow" aria-labelledby="business-flow-title">
  <header>
    <p class="eyebrow">{{ flow.eyebrow }}</p>
    <h2 id="business-flow-title">{{ flow.title }}</h2>
    <p>{{ flow.lead }}</p>
  </header>
  <div class="before-after">
    <article>
      <h3>Przed — ręczna obsługa</h3>
      <p>{{ flow.before }}</p>
    </article>
    <article>
      <h3>Po — propozycja zmiany</h3>
      <p>{{ flow.proposal }}</p>
    </article>
    <article>
      <h3>Decyzja pracownika</h3>
      <p>{{ flow.decision }}</p>
    </article>
  </div>
</section>
