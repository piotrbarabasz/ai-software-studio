<div class="carousel-controls">
  @if (hasMultipleItems) {
    <button
      type="button"
      class="carousel-button"
      aria-label="Poprzednie procesy"
      (click)="move(-1)"
    >
      <span aria-hidden="true">←</span>
    </button>
  }
  <p class="carousel-status" aria-live="polite" aria-atomic="true">{{ statusLabel }}</p>
  @if (hasMultipleItems) {
    <button type="button" class="carousel-button" aria-label="Następne procesy" (click)="move(1)">
      <span aria-hidden="true">→</span>
    </button>
  }
</div>
<div
  #viewport
  class="solution-carousel"
  tabindex="0"
  (scroll)="onScroll()"
  (keydown)="onKeydown($event)"
  aria-label="Karuzela procesów"
>
  @for (useCase of items; track useCase.id) {
    <article class="use-case-card" [attr.data-visual-kind]="useCase.visualKind">
      <h3>{{ useCase.title }}</h3>
      <app-use-case-visual [visualKind]="useCase.visualKind" />
      <div class="use-case-details">
        <div>
          <p class="use-case-label">Problem</p>
          <p class="use-case-text">{{ useCase.problem }}</p>
        </div>
        <div>
          <p class="use-case-label">Rezultat</p>
          <p class="use-case-text">{{ useCase.outcome }}</p>
        </div>
      </div>
      @if (useCase.cta) {
        <a
          class="secondary-action"
          [routerLink]="useCase.cta.path"
          [queryParams]="useCase.cta.queryParams"
          [fragment]="useCase.cta.fragment"
          >{{ useCase.cta.label }}</a
        >
      }
    </article>
  }
</div>
