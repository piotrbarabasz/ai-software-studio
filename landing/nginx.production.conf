# Public Protolume v3 on Cloud Run; indexable HTML and same-origin FastAPI contact.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'; font-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
    add_header Cache-Control "no-cache, max-age=0" always;

    gzip on;
    gzip_types text/css application/javascript application/xml text/plain image/svg+xml;

    location = / {
        try_files /index.html =404;
    }

    # Only the minimal contact route is proxied to the existing public FastAPI.
    # The browser talks to the same origin; no preview-wide CORS exception needed.
    location = /api/contact/brief {
        limit_except POST { deny all; }
        client_max_body_size 16k;
        proxy_set_header Host aisoftware-studio-api-175725977490.europe-central2.run.app;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass https://aisoftware-studio-api-175725977490.europe-central2.run.app;
        proxy_ssl_server_name on;
        proxy_ssl_name aisoftware-studio-api-175725977490.europe-central2.run.app;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location = /polityka-prywatnosci {
        return 308 /polityka-prywatnosci/;
    }

    location ^~ /polityka-prywatnosci/ {
        try_files $uri $uri/ =404;
    }

    # Preserve historical indexed URLs with permanent redirects.
    location ~ ^/kontakt/?$ { return 301 /#kontakt; }
    location ~ ^/(?:rozwiazania(?:/.*)?|produkty(?:/.*)?|chatbot-ai-dla-firm|voice-ai-dla-firm|automatyzacja-procesow|integracje-whatsapp-crm|systemy-agentowe)/?$ { return 301 /#obszary; }
    location ~ ^/(?:demo-w-7-dni|demo-ai|przyklad-demo|dla-software-house|development|studio|rd)/?$ { return 301 /; }

    location / {
        try_files $uri $uri/ =404;
    }
}
