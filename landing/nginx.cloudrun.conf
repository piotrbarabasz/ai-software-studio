# Cloud Run v3 review. Intentionally noindex, including at the HTTP header level.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    autoindex off;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self' mailto:; font-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
    add_header Cache-Control "no-store, max-age=0" always;

    gzip on;
    gzip_types text/css application/javascript application/xml text/plain image/svg+xml;

    location = / {
        try_files /index.html =404;
    }

    location = /polityka-prywatnosci {
        return 302 /polityka-prywatnosci/;
    }

    location ^~ /polityka-prywatnosci/ {
        try_files $uri $uri/ =404;
    }

    # Preserve useful old URLs as temporary redirects while the new site is reviewed.
    # Convert to permanent redirects only during the explicitly approved live cutover.
    location ~ ^/(?:demo-w-7-dni|demo-ai|przyklad-demo|produkty(?:/.*)?|rozwiazania(?:/.*)?|chatbot-ai-dla-firm|voice-ai-dla-firm|automatyzacja-procesow|integracje-whatsapp-crm|systemy-agentowe|dla-software-house|development|studio|rd|kontakt)/?$ {
        return 302 /;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
